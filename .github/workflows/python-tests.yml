name: Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    # Empty database for the SQL fixture tests; live-data tests skip without the dataset
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: retail
          POSTGRES_PASSWORD: retail
          POSTGRES_DB: retail_analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retail -d retail_analytics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RETAIL_DATABASE_URL: postgresql+psycopg://retail:retail@localhost:5432/retail_analytics
      REQUIRE_POSTGRES: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[modeling,serving,dev]"

      - name: Run tests
        run: python -m pytest -q
